# LLaMA-Factory LoRA 训练配置（RTX 5090 / 32GB / Qwythos-9B）
# 用法：llamafactory-cli train /root/autodl-tmp/data/llamafactory_train.yaml
# 冒烟测试用：max_samples: 200 先跑通；全量训练时删掉这一行再跑

model_name_or_path: /root/autodl-tmp/models/qwythos-9b
template: qwen3
stage: sft
finetuning_type: lora

dataset: mathpkg_v1
dataset_dir: /root/autodl-tmp/data
cutoff_len: 2048

learning_rate: 2.0e-4
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
max_samples: 200
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_steps: 500
eval_strategy: steps
eval_steps: 500
val_size: 0.01
optim: adamw_torch

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target: all

bf16: true
quantization_bit: 4
gradient_checkpointing: true

output_dir: /root/autodl-tmp/output/mathpkg_v1
plot_loss: true
